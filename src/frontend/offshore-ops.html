<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>海工特種作业 — PoseidonX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;700&family=Noto+Serif:wght@200;300;400;600;900&family=Noto+Serif+SC:wght@200;300;400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap">
<style>
:root{
  --shironeri:oklch(0.96 0.003 110);--ishi:oklch(0.91 0.004 110);--kabe:oklch(0.85 0.005 110);
  --hai:oklch(0.78 0.005 110);--nezumi:oklch(0.68 0.006 110);
  --sumi:oklch(0.18 0.008 110);--sumi-2:oklch(0.38 0.006 110);--sumi-3:oklch(0.55 0.005 110);
  --koke:oklch(0.52 0.04 160);--shu:oklch(0.48 0.07 22);--kitsune:oklch(0.56 0.05 70);
  --groove:oklch(0.82 0.004 110);--ridge:oklch(1.00 0 0 / 0.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:var(--shironeri);color:var(--sumi);overflow:hidden;padding:48px 16px 16px 80px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(oklch(0 0 0/.012) 1px,transparent 1px),radial-gradient(oklch(0 0 0/.008) 1px,transparent 1px);
  background-size:5px 5px,7px 7px;background-position:0 0,3px 3px}
.ofs-layout{display:grid;grid-template-columns:1fr 320px;gap:14px;height:calc(100vh - 80px);position:relative;z-index:1}
.canvas-wrap{position:relative;background:var(--ishi);border:1px solid var(--groove);overflow:hidden}
.canvas-wrap canvas{width:100%;height:100%;display:block}
.canvas-overlay{position:absolute;top:12px;left:14px;font-size:10px;color:var(--sumi-3);pointer-events:none;font-family:'JetBrains Mono',monospace}
.canvas-overlay div{margin-bottom:2px}
.dist-label{position:absolute;bottom:12px;right:14px;font-size:11px;color:var(--sumi-2);font-family:'JetBrains Mono',monospace;pointer-events:none}
.right-cards{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-right:4px}
.ops-card{background:var(--ishi);border:1px solid var(--groove);padding:16px}
.ops-card h5{margin:0 0 12px;font-family:'Noto Serif SC',serif;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px}
.ops-card h5 .seal{font-size:10px;font-weight:900;color:var(--shironeri);background:var(--sumi);padding:1px 5px;line-height:1.3;font-family:'Noto Serif SC',serif}
.ops-timer{font-size:40px;font-weight:800;text-align:center;padding:8px 0;font-variant-numeric:tabular-nums;color:var(--sumi);letter-spacing:2px;font-family:'JetBrains Mono',monospace}
.ops-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--kabe);font-size:12px}
.ops-row:last-child{border-bottom:none}
.ops-row .lbl{color:var(--sumi-3)}
.ops-row .val{font-weight:600}
.badge-s{display:inline-flex;padding:3px 10px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace}
.badge-ok{background:oklch(0.52 0.04 160/.1);color:var(--koke);border:1px solid oklch(0.52 0.04 160/.2)}
.badge-warn{background:oklch(0.56 0.05 70/.1);color:var(--kitsune);border:1px solid oklch(0.56 0.05 70/.2)}
.badge-alarm{background:oklch(0.48 0.07 22/.1);color:var(--shu);border:1px solid oklch(0.48 0.07 22/.2)}
.crane-gauge{text-align:center;padding:6px 0}
.crane-gauge canvas{width:100%;height:50px;display:block;margin-bottom:4px}
.crane-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.crane-stat{text-align:center}
.crane-stat .v{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace}
.crane-stat .l{font-size:10px;color:var(--sumi-3)}
.check-item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12px}
.check-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.check-dot.ok{background:var(--koke)}.check-dot.warn{background:var(--kitsune)}.check-dot.fail{background:var(--shu)}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.env-item{text-align:center;padding:10px;background:var(--kabe);border:1px solid var(--groove)}
.env-item .seal-icon{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:900}
.env-item .v{font-size:16px;font-weight:700;margin-top:2px;font-family:'JetBrains Mono',monospace}
.env-item .l{font-size:10px;color:var(--sumi-3)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--koke);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
</style>
<link rel="stylesheet" href="/css/openbridge-theme.css">
<link rel="stylesheet" href="/css/ws-theme-bridge.css">
</head>
<body>
<div class="ofs-layout">
<div class="canvas-wrap">
    <canvas id="safeZone"></canvas>
    <div class="canvas-overlay">
        <div>SAFETY ZONE DISPLAY</div>
        <div id="canvasTime"><span class="live-dot"></span> LIVE</div>
    </div>
    <div class="dist-label" id="distLabel">Distance: 823 m</div>
</div>
<div class="right-cards">
    <div class="ops-card">
        <h5><span class="seal">作</span> 作业狀态</h5>
        <div class="ops-timer" id="opsTimer">02:34:17</div>
        <div class="ops-row"><span class="lbl">作业类型</span><span class="val" id="opsType">起重吊装 Lifting</span></div>
        <div class="ops-row"><span class="lbl">許可狀态</span><span class="val"><span class="badge-s badge-ok" id="opsPermit">已批准</span></span></div>
        <div class="ops-row"><span class="lbl">作业区域</span><span class="val" id="opsArea">平台東南側</span></div>
        <div class="ops-row"><span class="lbl">客户</span><span class="val">CNOOC 南海西部</span></div>
    </div>
    <div class="ops-card">
        <h5><span class="seal">吊</span> 起重机狀态</h5>
        <div class="crane-gauge"><canvas id="craneGauge" height="50"></canvas></div>
        <div class="crane-stats">
            <div class="crane-stat"><div class="v" id="crBoom">45°</div><div class="l">臂仰角</div></div>
            <div class="crane-stat"><div class="v" id="crSlew">127°</div><div class="l">回转角</div></div>
            <div class="crane-stat"><div class="v" id="crHeight">18.3m</div><div class="l">吃鉤高度</div></div>
        </div>
    </div>
    <div class="ops-card">
        <h5><span class="seal">境</span> 环境條件</h5>
        <div class="env-grid">
            <div class="env-item"><div class="seal-icon">風</div><div class="v" id="envWind">16.2 kn</div><div class="l">風速 NW</div></div>
            <div class="env-item"><div class="seal-icon">浪</div><div class="v" id="envWave">1.6 m</div><div class="l">浪高</div></div>
            <div class="env-item"><div class="seal-icon">視</div><div class="v" id="envVis">8.5 nm</div><div class="l">能見度</div></div>
            <div class="env-item"><div class="seal-icon">温</div><div class="v" id="envTemp">22°C</div><div class="l">气温</div></div>
        </div>
        <div class="ops-row" style="margin-top:8px"><span class="lbl">作业限制</span><span class="val"><span class="badge-s badge-ok" id="envLimit">未超限</span></span></div>
    </div>
    <div class="ops-card">
        <h5><span class="seal">査</span> 安全检查單</h5>
        <div class="check-item"><span class="check-dot ok"></span>DP 系统狀态确认</div>
        <div class="check-item"><span class="check-dot ok"></span>通信链路测試</div>
        <div class="check-item"><span class="check-dot ok"></span>人员就位确认</div>
        <div class="check-item"><span class="check-dot warn"></span>气象窗口核实</div>
        <div class="check-item"><span class="check-dot ok"></span>应急预案就緒</div>
        <div class="check-item"><span class="check-dot ok"></span>吊具检驗合格</div>
        <div class="check-item"><span class="check-dot ok"></span>安全区域清场</div>
    </div>
</div>
</div>
<script>
const WS={sumi:'oklch(0.18 0.008 110)',sumi2:'oklch(0.38 0.006 110)',sumi3:'oklch(0.55 0.005 110)',
  koke:'oklch(0.52 0.04 160)',kitsune:'oklch(0.56 0.05 70)',shu:'oklch(0.48 0.07 22)',
  groove:'oklch(0.82 0.004 110)',kabe:'oklch(0.85 0.005 110)',hai:'oklch(0.78 0.005 110)',
  nezumi:'oklch(0.68 0.006 110)',shironeri:'oklch(0.96 0.003 110)',ishi:'oklch(0.91 0.004 110)'};

const cv=document.getElementById('safeZone'),ctx=cv.getContext('2d');
let vesX=800,vesY=-200;
function resize(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight;}
resize();window.addEventListener('resize',resize);

function drawSafeZone(){
    const W=cv.width,H=cv.height,cxp=W/2,cyp=H/2;
    const scale=Math.min(W,H)/5000;
    ctx.fillStyle=WS.shironeri;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=WS.kabe;ctx.lineWidth=1;
    for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
    for(let j=0;j<H;j+=40){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke();}
    const t=Date.now()/3000;
    const zones=[{r:2000,c:'oklch(0.52 0.04 160/.06)',s:WS.koke,l:'2000m 安全区'},{r:1000,c:'oklch(0.56 0.05 70/.05)',s:WS.kitsune,l:'1000m 警戒区'},{r:500,c:'oklch(0.48 0.07 22/.05)',s:WS.shu,l:'500m 危险区'}];
    zones.forEach(z=>{
        const r=z.r*scale;
        ctx.beginPath();ctx.arc(cxp,cyp,r,0,Math.PI*2);ctx.fillStyle=z.c;ctx.fill();
        ctx.save();ctx.beginPath();ctx.arc(cxp,cyp,r,0,Math.PI*2);ctx.strokeStyle=z.s;ctx.lineWidth=1.5;ctx.setLineDash([8,6]);ctx.lineDashOffset=-t*r*0.05;ctx.stroke();ctx.setLineDash([]);ctx.restore();
        ctx.fillStyle=z.s;ctx.font="11px 'Noto Sans SC'";ctx.textAlign='left';ctx.fillText(z.l,cxp+r*0.68,cyp-r*0.72);
    });
    const pw=70,ph=50;
    ctx.fillStyle=WS.hai;ctx.fillRect(cxp-pw/2,cyp-ph/2,pw,ph);
    ctx.strokeStyle=WS.nezumi;ctx.lineWidth=1.5;ctx.strokeRect(cxp-pw/2,cyp-ph/2,pw,ph);
    ctx.fillStyle=WS.sumi;ctx.font="bold 10px 'Noto Sans SC'";ctx.textAlign='center';ctx.fillText('PLATFORM',cxp,cyp+3);
    ctx.beginPath();ctx.arc(cxp,cyp-ph/2-15,12,0,Math.PI*2);ctx.strokeStyle=WS.nezumi;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=WS.nezumi;ctx.font="8px 'Noto Sans SC'";ctx.fillText('H',cxp,cyp-ph/2-12);
    const vx=cxp+vesX*scale,vy=cyp+vesY*scale;
    ctx.save();ctx.translate(vx,vy);ctx.rotate(Math.PI*0.8);
    ctx.beginPath();ctx.moveTo(0,-20);ctx.bezierCurveTo(7,-10,9,10,7,18);ctx.lineTo(-7,18);ctx.bezierCurveTo(-9,10,-7,-10,0,-20);ctx.closePath();
    ctx.fillStyle=WS.sumi;ctx.fill();ctx.strokeStyle=WS.hai;ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
    ctx.fillStyle=WS.sumi;ctx.font="11px 'Noto Sans SC'";ctx.textAlign='left';ctx.fillText('OUR VESSEL',vx+16,vy+4);
    ctx.setLineDash([6,4]);ctx.strokeStyle=WS.hai;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cxp,cyp);ctx.lineTo(vx,vy);ctx.stroke();ctx.setLineDash([]);
    const dist=Math.round(Math.sqrt(vesX*vesX+vesY*vesY));
    const mx=(cxp+vx)/2,my=(cyp+vy)/2;
    ctx.fillStyle=WS.sumi2;ctx.font="13px 'JetBrains Mono'";ctx.textAlign='center';ctx.fillText(dist+' m',mx,my-10);
    document.getElementById('distLabel').textContent='Distance: '+dist+' m';
    ctx.fillStyle=WS.sumi3;ctx.font="12px 'Noto Sans SC'";ctx.textAlign='center';
    ctx.fillText('N',cxp,22);ctx.fillText('S',cxp,H-10);ctx.textAlign='left';ctx.fillText('W',8,cyp+4);ctx.textAlign='right';ctx.fillText('E',W-8,cyp+4);
}
function animate(){vesX+=(Math.random()-.5)*3;vesY+=(Math.random()-.5)*3;drawSafeZone();requestAnimationFrame(animate);}
animate();

function drawCraneGauge(load,maxLoad){
    const gc=document.getElementById('craneGauge'),gctx=gc.getContext('2d');
    const W=gc.width=gc.offsetWidth,H=gc.height=50;
    const ratio=load/maxLoad,barH=16,pad=40;
    gctx.clearRect(0,0,W,H);
    gctx.fillStyle=WS.kabe;gctx.fillRect(pad,H/2-barH/2,W-pad*2,barH);
    const fillW=(W-pad*2)*ratio;
    const c=ratio>0.85?WS.shu:ratio>0.65?WS.kitsune:WS.koke;
    gctx.fillStyle=c;gctx.fillRect(pad,H/2-barH/2,fillW,barH);
    gctx.fillStyle=WS.sumi2;gctx.font="12px 'JetBrains Mono'";gctx.textAlign='left';gctx.fillText(load+' t',pad,H/2-barH/2-4);
    gctx.textAlign='right';gctx.fillStyle=WS.sumi3;gctx.fillText('/ '+maxLoad+' t',W-pad,H/2-barH/2-4);
    gctx.textAlign='center';gctx.fillStyle=WS.sumi;gctx.fillText(Math.round(ratio*100)+'%',W/2,H/2+5);
}
drawCraneGauge(12.5,25);

let sec=9257;
setInterval(()=>{sec++;const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;document.getElementById('opsTimer').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');},1000);
setInterval(()=>{const el=document.getElementById('canvasTime');if(el)el.innerHTML='<span class="live-dot"></span> LIVE  '+new Date().toLocaleTimeString('en-GB');},1000);

function fetchOps(){fetch('/api/v1/ops/current-operation').then(r=>r.json()).then(d=>{if(d.operation){document.getElementById('opsType').textContent=d.operation.type||'—';document.getElementById('opsArea').textContent=d.operation.platform||'—';}}).catch(()=>{});}
function fetchCrane(){fetch('/api/v1/ops/crane-status').then(r=>r.json()).then(d=>{const cr=(d.cranes||[])[0];if(!cr)return;drawCraneGauge(cr.load_tonnes,cr.max_load_tonnes);document.getElementById('crBoom').textContent=cr.boom_angle_deg+'°';document.getElementById('crSlew').textContent=cr.slew_deg+'°';document.getElementById('crHeight').textContent=cr.height_m+'m';}).catch(()=>{});}
function fetchEnv(){fetch('/api/v1/environment/wind-current').then(r=>r.json()).then(d=>{document.getElementById('envWind').textContent=d.wind.speed_kn+' kn';document.getElementById('envWave').textContent=d.wave.height_m+' m';}).catch(()=>{});}
fetchOps();fetchCrane();fetchEnv();setInterval(fetchOps,10000);setInterval(fetchCrane,5000);setInterval(fetchEnv,10000);
(function(){let ws;function cn(){try{ws=new WebSocket('ws://'+location.host+'/ws');ws.onclose=()=>setTimeout(cn,5000);ws.onerror=()=>ws.close();}catch(e){setTimeout(cn,5000);}}cn();})();
</script>
<script src="/js/i18n.js"></script>
<script src="/js/nav-sidebar.js" data-active="offshore"></script>
</body>
</html>
