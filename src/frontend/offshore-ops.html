<!DOCTYPE html>
<html lang="zh-CN" data-obc-theme="dusk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ob-title" content="海工特种作业">
    <meta name="ob-subtitle" content="K-Pos DPM — 作业管控与安全区">
    <title>海工特种作业 — PoseidonX</title>
    <link rel="stylesheet" href="/css/openbridge-theme.css">
    <style>
        body{margin:0;padding:var(--ob-topbar-height,48px) 24px 24px 80px;background:var(--ob-bg-global);color:var(--ob-text-primary);font-family:var(--ob-font,sans-serif);}
        .ofs-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;height:calc(100vh - 80px);}
        .canvas-wrap{background:var(--ob-bg-card);border:1px solid var(--ob-border);border-radius:var(--ob-radius-lg);position:relative;overflow:hidden;}
        .canvas-wrap canvas{width:100%;height:100%;display:block;}
        .right-cards{display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
        .ops-card{background:var(--ob-bg-card);border:1px solid var(--ob-border);border-radius:var(--ob-radius-lg);padding:16px;}
        .ops-card h4{margin:0 0 10px;font-size:13px;font-weight:600;}
        .ops-timer{font-size:36px;font-weight:700;text-align:center;padding:8px 0;font-variant-numeric:tabular-nums;color:var(--ob-running,#00b0f0);}
        .ops-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--ob-border);}
        .ops-row:last-child{border:none;}
        .crane-bar{margin:8px 0;}
        .safety-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;}
    </style>
</head>
<body>
    <div class="ofs-layout">
        <div class="canvas-wrap"><canvas id="safeZone"></canvas></div>
        <div class="right-cards">
            <div class="ops-card">
                <h4>作业状态 Operation Status</h4>
                <div class="ops-timer" id="opsTimer">02:34:17</div>
                <div class="ops-row"><span>作业类型</span><span>起重吊装 Lifting</span></div>
                <div class="ops-row"><span>许可状态</span><span class="ob-badge ob-badge-ok">已批准</span></div>
                <div class="ops-row"><span>作业区域</span><span>平台东南侧</span></div>
            </div>
            <div class="ops-card">
                <h4>起重机 #1 Crane Status</h4>
                <div class="ops-row"><span>负载</span><span>12.5 / 25 t</span></div>
                <div class="crane-bar"><div class="ob-progress"><div class="ob-progress-bar" style="width:50%;background:var(--ob-running)"></div></div></div>
                <div class="ops-row"><span>臂仰角</span><span>45°</span></div>
                <div class="ops-row"><span>回转角</span><span>127°</span></div>
                <div class="ops-row"><span>吃钩高度</span><span>18.3 m</span></div>
            </div>
            <div class="ops-card">
                <h4>环境条件 Environmental</h4>
                <div class="ops-row"><span>风速</span><span>16.2 kn (NW)</span></div>
                <div class="ops-row"><span>浪高</span><span>1.6 m</span></div>
                <div class="ops-row"><span>能见度</span><span>8.5 nm</span></div>
                <div class="ops-row"><span>作业限制</span><span class="ob-badge ob-badge-ok">未超限</span></div>
            </div>
            <div class="ops-card">
                <h4>安全检查 Safety Checklist</h4>
                <div class="safety-item"><span class="ob-dot ob-dot-ok"></span>DP 状态确认</div>
                <div class="safety-item"><span class="ob-dot ob-dot-ok"></span>通信链路测试</div>
                <div class="safety-item"><span class="ob-dot ob-dot-ok"></span>人员就位确认</div>
                <div class="safety-item"><span class="ob-dot ob-dot-warning"></span>气象窗口核实</div>
                <div class="safety-item"><span class="ob-dot ob-dot-ok"></span>应急预案就绪</div>
            </div>
        </div>
    </div>
    <script>
    (function(){
        var cv=document.getElementById('safeZone');
        function draw(){
            var W=cv.width=cv.offsetWidth;var H=cv.height=cv.offsetHeight;
            var ctx=cv.getContext('2d');var cx=W/2,cy=H/2;
            var scale=Math.min(W,H)/5000;
            ctx.fillStyle='rgba(10,15,30,0.95)';ctx.fillRect(0,0,W,H);
            ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
            for(var i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
            for(var j=0;j<H;j+=40){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke();}
            var zones=[{r:2000,c:'rgba(0,200,80,0.12)',s:'rgba(0,200,80,0.4)',l:'2000m 安全区'},{r:1000,c:'rgba(255,200,0,0.10)',s:'rgba(255,200,0,0.4)',l:'1000m 警戒区'},{r:500,c:'rgba(255,60,60,0.12)',s:'rgba(255,60,60,0.5)',l:'500m 危险区'}];
            zones.forEach(function(z){
                var r=z.r*scale;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=z.c;ctx.fill();
                ctx.strokeStyle=z.s;ctx.lineWidth=1.5;ctx.stroke();
                ctx.fillStyle=z.s;ctx.font='11px sans-serif';ctx.fillText(z.l,cx+r*0.7,cy-r*0.7);
            });
            var pw=60,ph=40;ctx.fillStyle='rgba(200,200,200,0.8)';ctx.fillRect(cx-pw/2,cy-ph/2,pw,ph);
            ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(cx-pw/2,cy-ph/2,pw,ph);
            ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('PLATFORM',cx,cy+4);
            var vx=cx+800*scale,vy=cy-200*scale;
            ctx.save();ctx.translate(vx,vy);ctx.rotate(Math.PI*0.8);
            ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(-8,10);ctx.lineTo(8,10);ctx.closePath();
            ctx.fillStyle='rgba(0,176,240,0.9)';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();ctx.restore();
            ctx.fillStyle='rgba(0,176,240,1)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('OUR VESSEL',vx+14,vy+4);
            ctx.setLineDash([6,4]);ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(vx,vy);ctx.stroke();ctx.setLineDash([]);
            var mx=(cx+vx)/2,my=(cy+vy)/2;
            ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('823 m',mx,my-8);
            ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';ctx.textAlign='center';
            ctx.fillText('N',cx,30);ctx.fillText('S',cx,H-15);
            ctx.textAlign='left';ctx.fillText('W',10,cy+4);ctx.textAlign='right';ctx.fillText('E',W-10,cy+4);
        }
        draw();window.addEventListener('resize',draw);
        var sec=9257;
        setInterval(function(){
            sec++;var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
            document.getElementById('opsTimer').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
        },1000);
    })();
    </script>
    <script src="/js/nav-sidebar.js" data-active="offshore"></script>
    <script>(function(){var ws;function cn(){try{ws=new WebSocket('ws://'+location.host+'/ws');ws.onclose=function(){setTimeout(cn,5000);};}catch(e){setTimeout(cn,5000);}}cn();})();</script>
</body>
</html>
