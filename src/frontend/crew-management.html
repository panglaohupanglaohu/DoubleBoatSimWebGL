<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>船员管理 — PoseidonX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;700&family=Noto+Serif:wght@200;300;400;600;900&family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --shironeri:oklch(0.96 0.003 110);--ishi:oklch(0.91 0.004 110);--kabe:oklch(0.85 0.006 110);
  --hai:oklch(0.78 0.006 110);--nezumi:oklch(0.68 0.005 110);--sumi:oklch(0.18 0.008 110);
  --koke:oklch(0.42 0.05 160);--shu:oklch(0.48 0.12 28);--kitsune:oklch(0.56 0.08 65);
  --washi-dot:oklch(0.88 0.004 110);
  --font-serif:'Noto Serif SC',serif;--font-sans:'Noto Sans SC',sans-serif;--font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--shironeri);color:var(--sumi);min-height:100vh;padding:48px 16px 16px 80px;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 20% 30%,var(--washi-dot) 0.5px,transparent 0.5px),
  radial-gradient(circle at 60% 70%,var(--washi-dot) 0.3px,transparent 0.3px),
  radial-gradient(circle at 80% 20%,var(--washi-dot) 0.4px,transparent 0.4px);
  background-size:60px 60px,45px 45px,55px 55px;opacity:.4}
.cr-layout{display:grid;grid-template-columns:1fr 1fr 300px;grid-template-rows:auto 1fr;gap:14px;min-height:calc(100vh - 80px);position:relative;z-index:1}
.glass{background:var(--shironeri);border:1px solid var(--kabe);padding:16px;overflow:hidden;box-shadow:2px 2px 0 var(--ishi)}
.glass h5{margin:0 0 12px;font-family:var(--font-serif);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.seal{font-family:var(--font-serif);font-size:13px;color:var(--shu);border:1.5px solid var(--shu);width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;transform:rotate(-2deg);flex-shrink:0}
/* Stats Bar */
.stats-bar{grid-column:1/4;display:flex;gap:12px}
.stat-chip{flex:1;background:var(--shironeri);border:1px solid var(--kabe);padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:2px 2px 0 var(--ishi)}
.stat-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:18px;font-weight:900;color:var(--shu);border:1.5px solid var(--shu);transform:rotate(-2deg)}
.stat-info .v{font-size:22px;font-weight:800;font-family:var(--font-mono);letter-spacing:-.5px}
.stat-info .l{font-size:11px;color:var(--nezumi);margin-top:2px}
/* Crew List */
.crew-search{width:100%;padding:8px 14px;background:var(--ishi);border:1px solid var(--kabe);color:var(--sumi);font-family:var(--font-sans);font-size:13px;outline:none;margin-bottom:12px}
.crew-search:focus{border-color:var(--koke)}
.crew-search::placeholder{color:var(--hai)}
.crew-list{max-height:calc(100vh - 260px);overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.crew-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--ishi);border:1px solid transparent;cursor:pointer;transition:all .2s}
.crew-row:hover,.crew-row.active{background:oklch(0.42 0.05 160 / .06);border-color:oklch(0.42 0.05 160 / .15)}
.crew-avatar{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:14px;font-weight:700;flex-shrink:0;color:var(--shironeri)}
.crew-info{flex:1;min-width:0}
.crew-info .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew-info .role{font-family:var(--font-mono);font-size:10px;color:var(--nezumi)}
.crew-status{width:10px;height:10px;flex-shrink:0}
.crew-status.on{background:var(--koke)}
.crew-status.off{background:var(--kitsune)}
.crew-status.rest{background:var(--nezumi)}
.crew-status.alert{background:var(--shu)}
/* Rest Hours Chart */
.rest-canvas{width:100%;height:calc(100% - 36px)}
/* Right sidebar */
.right-stack{grid-row:2/3;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-right:4px}
.sm-card{padding:14px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ishi);font-size:12px}
.row:last-child{border-bottom:none}
.row .lbl{color:var(--nezumi)}
.row .val{font-family:var(--font-mono);font-weight:600}
.badge{display:inline-flex;padding:3px 10px;font-family:var(--font-mono);font-size:10px;font-weight:600}
.badge-ok{background:oklch(0.42 0.05 160 / .1);color:var(--koke);border:1px solid oklch(0.42 0.05 160 / .2)}
.badge-warn{background:oklch(0.56 0.08 65 / .1);color:var(--kitsune);border:1px solid oklch(0.56 0.08 65 / .2)}
.badge-alarm{background:oklch(0.48 0.12 28 / .1);color:var(--shu);border:1px solid oklch(0.48 0.12 28 / .2)}
/* Cert list */
.cert-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ishi);font-size:12px}
.cert-item:last-child{border-bottom:none}
.cert-dot{width:8px;height:8px;flex-shrink:0}
.cert-dot.valid{background:var(--koke)}
.cert-dot.expiring{background:var(--kitsune)}
.cert-dot.expired{background:var(--shu)}
.cert-info{flex:1}
.cert-info .cn{font-weight:600}
.cert-info .cd{font-family:var(--font-mono);font-size:10px;color:var(--nezumi)}
/* Drill Log */
.drill-item{padding:8px 0;border-bottom:1px solid var(--ishi);font-size:12px}
.drill-item:last-child{border-bottom:none}
.drill-item .dt{display:flex;justify-content:space-between}
.drill-item .dt .type{font-weight:600}
.drill-item .dt .date{font-family:var(--font-mono);color:var(--nezumi);font-size:10px}
.drill-item .score{margin-top:4px;display:flex;align-items:center;gap:8px}
.drill-bar{flex:1;height:6px;background:var(--ishi);overflow:hidden}
.drill-fill{height:100%}
.drill-pct{font-family:var(--font-mono);font-size:10px;font-weight:600;width:32px;text-align:right}
.fatigue-gauge{text-align:center;padding:8px 0}
.fatigue-arc{margin:0 auto;display:block}
</style>
<link rel="stylesheet" href="/css/openbridge-theme.css">
<link rel="stylesheet" href="/css/ws-theme-bridge.css">
</head>
<body>
<div class="cr-layout">
<div class="stats-bar">
    <div class="stat-chip"><div class="stat-icon">员</div><div class="stat-info"><div class="v" id="totalCrew">28</div><div class="l">总船员</div></div></div>
    <div class="stat-chip"><div class="stat-icon">值</div><div class="stat-info"><div class="v" id="onDuty">12</div><div class="l">当值</div></div></div>
    <div class="stat-chip"><div class="stat-icon">息</div><div class="stat-info"><div class="v" id="resting">14</div><div class="l">休息</div></div></div>
    <div class="stat-chip"><div class="stat-icon">勞</div><div class="stat-info"><div class="v" id="alertCount">2</div><div class="l">疲勞预警</div></div></div>
    <div class="stat-chip"><div class="stat-icon">证</div><div class="stat-info"><div class="v" id="certAlert">3</div><div class="l">证書到期</div></div></div>
</div>
<div class="glass crew-panel">
    <h5><span class="seal">冊</span> 船员花名冊</h5>
    <input class="crew-search" id="crewSearch" placeholder="搜索船员 / 职务...">
    <div class="crew-list" id="crewList"></div>
</div>
<div class="glass rest-panel">
    <h5><span class="seal">勤</span> 休息时間合规 MLC Work/Rest</h5>
    <canvas id="restChart" class="rest-canvas"></canvas>
</div>
<div class="right-stack">
    <div class="glass sm-card">
        <h5><span class="seal">危</span> 疲勞風险 CRI</h5>
        <div class="fatigue-gauge"><canvas id="fatigueArc" class="fatigue-arc" width="200" height="110"></canvas></div>
        <div class="row"><span class="lbl">船舶 CRI 评分</span><span class="val" id="criScore">72 / 100</span></div>
        <div class="row"><span class="lbl">高风险人员</span><span class="val"><span class="badge badge-warn" id="criHigh">2 人</span></span></div>
        <div class="row"><span class="lbl">MLC 合规</span><span class="val"><span class="badge badge-ok" id="mlcStatus">达标</span></span></div>
    </div>
    <div class="glass sm-card">
        <h5><span class="seal">证</span> STCW 证書监控</h5>
        <div id="certList"></div>
    </div>
    <div class="glass sm-card">
        <h5><span class="seal">演</span> 应急演练记录</h5>
        <div id="drillLog"></div>
    </div>
    <div class="glass sm-card">
        <h5><span class="seal">班</span> 值班安排</h5>
        <div class="row"><span class="lbl">当前班次</span><span class="val" id="curWatch">0800-1200 甲班</span></div>
        <div class="row"><span class="lbl">驾驶台</span><span class="val">大副 / 水手长</span></div>
        <div class="row"><span class="lbl">机舱</span><span class="val">大管轮 / 机工</span></div>
        <div class="row"><span class="lbl">下次换班</span><span class="val" id="nextWatch">12:00</span></div>
    </div>
</div>
</div>

<script>
const WS={shironeri:'oklch(0.96 0.003 110)',ishi:'oklch(0.91 0.004 110)',kabe:'oklch(0.85 0.006 110)',hai:'oklch(0.78 0.006 110)',nezumi:'oklch(0.68 0.005 110)',sumi:'oklch(0.18 0.008 110)',koke:'oklch(0.42 0.05 160)',shu:'oklch(0.48 0.12 28)',kitsune:'oklch(0.56 0.08 65)'};

const CREW=[
{name:'张伟',role:'船长 Master',dept:'deck',status:'on',restH:7.5,cert:'STCW-II/2',certExp:'2027-03'},
{name:'李明',role:'大副 Chief Officer',dept:'deck',status:'on',restH:6.8,cert:'STCW-II/2',certExp:'2026-08'},
{name:'王强',role:'二副 2/O',dept:'deck',status:'rest',restH:9.2,cert:'STCW-II/1',certExp:'2026-12'},
{name:'赵刚',role:'三副 3/O',dept:'deck',status:'on',restH:7.0,cert:'STCW-II/1',certExp:'2027-06'},
{name:'陈海',role:'轮机长 C/E',dept:'engine',status:'on',restH:6.5,cert:'STCW-III/2',certExp:'2027-01'},
{name:'刘洋',role:'大管轮 1/E',dept:'engine',status:'on',restH:7.2,cert:'STCW-III/2',certExp:'2026-05'},
{name:'杨帆',role:'二管轮 2/E',dept:'engine',status:'rest',restH:10.1,cert:'STCW-III/1',certExp:'2027-09'},
{name:'黄河',role:'三管轮 3/E',dept:'engine',status:'rest',restH:8.5,cert:'STCW-III/1',certExp:'2026-11'},
{name:'周航',role:'水手长 Bosun',dept:'deck',status:'on',restH:6.9,cert:'STCW-II/4',certExp:'2026-07'},
{name:'吴波',role:'一等水手 AB',dept:'deck',status:'rest',restH:9.8,cert:'STCW-II/5',certExp:'2027-02'},
{name:'郑风',role:'一等水手 AB',dept:'deck',status:'rest',restH:11.0,cert:'STCW-II/5',certExp:'2027-04'},
{name:'孙涛',role:'一等水手 AB',dept:'deck',status:'on',restH:7.3,cert:'STCW-II/5',certExp:'2026-10'},
{name:'马力',role:'机工长 No.1 Oiler',dept:'engine',status:'on',restH:6.2,cert:'STCW-III/5',certExp:'2026-06'},
{name:'胡锚',role:'机工 Oiler',dept:'engine',status:'rest',restH:9.0,cert:'STCW-III/5',certExp:'2027-05'},
{name:'林远',role:'电机员 Electrician',dept:'engine',status:'on',restH:7.8,cert:'STCW-III/6',certExp:'2027-07'},
{name:'何深',role:'厨师 Cook',dept:'service',status:'rest',restH:10.5,cert:'STCW-VI/3',certExp:'2027-01'},
{name:'罗晨',role:'服务员 Steward',dept:'service',status:'rest',restH:12.0,cert:'STCW-VI/1',certExp:'2026-09'},
{name:'谢安',role:'实习驾驶员 Cadet',dept:'deck',status:'rest',restH:10.0,cert:'STCW-II/1',certExp:'2028-01'},
{name:'韩冰',role:'实习轮机员 Cadet',dept:'engine',status:'rest',restH:10.2,cert:'STCW-III/1',certExp:'2028-03'},
{name:'唐风',role:'一等水手 AB',dept:'deck',status:'on',restH:6.0,cert:'STCW-II/5',certExp:'2026-04'},
];

const INITIALS_BG={deck:WS.sumi,engine:WS.kitsune,service:WS.nezumi};

function renderCrew(filter=''){
    const el=document.getElementById('crewList');
    const f=filter.toLowerCase();
    el.innerHTML=CREW.filter(c=>!f||c.name.includes(f)||c.role.toLowerCase().includes(f)).map((c,i)=>`
        <div class="crew-row" data-i="${i}">
            <div class="crew-avatar" style="background:${INITIALS_BG[c.dept]}">${c.name[0]}</div>
            <div class="crew-info"><div class="name">${c.name}</div><div class="role">${c.role}</div></div>
            <div class="crew-status ${c.status}" title="${c.status==='on'?'当值':c.status==='rest'?'休息':c.status==='off'?'下班':'预警'}"></div>
        </div>
    `).join('');
}
renderCrew();
document.getElementById('crewSearch').addEventListener('input',e=>renderCrew(e.target.value));

// ── Rest Hours Chart (MLC bar chart) ──
(function(){
const cv=document.getElementById('restChart'),ctx=cv.getContext('2d');
function resize(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight-36;}
resize();window.addEventListener('resize',resize);

function draw(){
    const W=cv.width,H=cv.height,n=CREW.length;
    const pad={top:20,bottom:30,left:50,right:20};
    const cw=Math.min(24,(W-pad.left-pad.right)/n-4);
    ctx.clearRect(0,0,W,H);
    const maxH=14,minRest=10;
    const scale=(H-pad.top-pad.bottom)/maxH;
    ctx.strokeStyle=WS.ishi;ctx.lineWidth=1;
    for(let h=0;h<=maxH;h+=2){const y=H-pad.bottom-h*scale;ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();ctx.fillStyle=WS.nezumi;ctx.font='10px "JetBrains Mono",monospace';ctx.textAlign='right';ctx.fillText(h+'h',pad.left-6,y+3);}
    const ry=H-pad.bottom-minRest*scale;
    ctx.strokeStyle='oklch(0.42 0.05 160 / .3)';ctx.lineWidth=1;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(pad.left,ry);ctx.lineTo(W-pad.right,ry);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=WS.koke;ctx.font='10px "Noto Sans SC",sans-serif';ctx.textAlign='left';ctx.fillText('MLC Min Rest 10h',pad.left+4,ry-4);
    CREW.forEach((c,i)=>{
        const x=pad.left+i*(cw+4)+2;
        const h=c.restH;
        const barH=h*scale;
        const y=H-pad.bottom-barH;
        const ok=h>=minRest;
        const warn=h>=7&&h<minRest;
        const color=ok?WS.koke:warn?WS.kitsune:WS.shu;
        ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,cw,barH,3);ctx.fill();
        ctx.save();ctx.translate(x+cw/2,H-pad.bottom+6);ctx.rotate(Math.PI/4);ctx.fillStyle=WS.hai;ctx.font='9px "Noto Sans SC",sans-serif';ctx.textAlign='left';ctx.fillText(c.name.slice(0,3),0,0);ctx.restore();
        if(cw>12){ctx.fillStyle=WS.nezumi;ctx.font='9px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.fillText(h.toFixed(1),x+cw/2,y-4);}
    });
    ctx.save();ctx.translate(12,H/2);ctx.rotate(-Math.PI/2);ctx.fillStyle=WS.hai;ctx.font='11px "Noto Sans SC",sans-serif';ctx.textAlign='center';ctx.fillText('休息时间 (h)',0,0);ctx.restore();
}
draw();
setInterval(()=>{CREW.forEach(c=>{c.restH=Math.max(4,Math.min(13,c.restH+(Math.random()-.5)*0.3));});draw();},5000);
})();

// ── Fatigue Arc Gauge ──
(function(){
const cv=document.getElementById('fatigueArc'),ctx=cv.getContext('2d');
let score=72;
function draw(){
    const W=cv.width,H=cv.height,cx=W/2,cy=H-10,R=80;
    ctx.clearRect(0,0,W,H);
    ctx.beginPath();ctx.arc(cx,cy,R,Math.PI,0);ctx.strokeStyle=WS.kabe;ctx.lineWidth=14;ctx.lineCap='butt';ctx.stroke();
    const ratio=score/100;
    const color=score>=70?WS.koke:score>=40?WS.kitsune:WS.shu;
    ctx.beginPath();ctx.arc(cx,cy,R,Math.PI,Math.PI+Math.PI*ratio);ctx.strokeStyle=color;ctx.lineWidth=14;ctx.lineCap='butt';ctx.stroke();
    ctx.fillStyle=WS.sumi;ctx.font='bold 28px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.fillText(score,cx,cy-20);
    ctx.fillStyle=WS.nezumi;ctx.font='11px "Noto Sans SC",sans-serif';ctx.fillText('CRI Score',cx,cy-2);
    ctx.fillStyle=WS.hai;ctx.font='9px "Noto Sans SC",sans-serif';ctx.textAlign='left';ctx.fillText('高风险',cx-R-10,cy+10);ctx.textAlign='right';ctx.fillText('低风险',cx+R+10,cy+10);
}
draw();
setInterval(()=>{score=Math.max(30,Math.min(95,score+Math.round((Math.random()-.5)*3)));document.getElementById('criScore').textContent=score+' / 100';draw();},4000);
})();

// ── Certificates ──
(function(){
const el=document.getElementById('certList');
const certs=[
{name:'唐风',cert:'STCW-II/5',exp:'2026-04-15',status:'expired'},
{name:'刘洋',cert:'STCW-III/2',exp:'2026-05-20',status:'expiring'},
{name:'马力',cert:'STCW-III/5',exp:'2026-06-10',status:'expiring'},
{name:'周航',cert:'STCW-II/4',exp:'2026-07-01',status:'expiring'},
{name:'李明',cert:'STCW-II/2',exp:'2026-08-15',status:'valid'},
];
el.innerHTML=certs.map(c=>`
<div class="cert-item">
    <span class="cert-dot ${c.status}"></span>
    <div class="cert-info"><div class="cn">${c.name} — ${c.cert}</div><div class="cd">到期: ${c.exp}</div></div>
</div>`).join('');
})();

// ── Drill Log ──
(function(){
const el=document.getElementById('drillLog');
const drills=[
{type:'弃船演习',date:'2026-03-15',score:92},
{type:'消防演习',date:'2026-03-01',score:88},
{type:'落水救援',date:'2026-02-20',score:95},
{type:'堵漏演习',date:'2026-02-05',score:79},
{type:'GMDSS 遇险',date:'2026-01-18',score:91},
];
el.innerHTML=drills.map(d=>{
const c=d.score>=90?'var(--koke)':d.score>=80?'var(--sumi)':'var(--kitsune)';
return `<div class="drill-item"><div class="dt"><span class="type">${d.type}</span><span class="date">${d.date}</span></div><div class="score"><div class="drill-bar"><div class="drill-fill" style="width:${d.score}%;background:${c}"></div></div><div class="drill-pct" style="color:${c}">${d.score}%</div></div></div>`;
}).join('');
})();

// ── Watch time ──
(function(){
const hr=new Date().getHours();
const watches=[{s:0,e:4,n:'0000-0400 丙班'},{s:4,e:8,n:'0400-0800 甲班'},{s:8,e:12,n:'0800-1200 甲班'},{s:12,e:16,n:'1200-1600 乙班'},{s:16,e:20,n:'1600-2000 乙班'},{s:20,e:24,n:'2000-0000 丙班'}];
const w=watches.find(w=>hr>=w.s&&hr<w.e)||watches[0];
document.getElementById('curWatch').textContent=w.n;
document.getElementById('nextWatch').textContent=String(w.e%24).padStart(2,'0')+':00';
})();

function fetchCrew(){
    fetch('/api/v1/crew/roster').then(r=>r.json()).then(d=>{
        if(d.total)document.getElementById('totalCrew').textContent=d.total;
        if(d.on_duty)document.getElementById('onDuty').textContent=d.on_duty;
    }).catch(()=>{});
}
function fetchFatigue(){
    fetch('/api/v1/crew/fatigue-risk').then(r=>r.json()).then(d=>{
        if(d.alert_count)document.getElementById('alertCount').textContent=d.alert_count;
    }).catch(()=>{});
}
fetchCrew();fetchFatigue();
setInterval(fetchCrew,30000);setInterval(fetchFatigue,30000);

(function(){let ws;function cn(){try{ws=new WebSocket('ws://'+location.host+'/ws');ws.onclose=()=>setTimeout(cn,5000);ws.onerror=()=>ws.close();}catch(e){setTimeout(cn,5000);}}cn();})();
</script>
<script src="/js/i18n.js"></script>
<script src="/js/nav-sidebar.js" data-active="crew"></script>
</body>
</html>
