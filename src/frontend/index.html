<!DOCTYPE html>
<html lang="zh-CN" data-obc-theme="dusk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoseidonX — 深海远洋双体船舶智能综合信息系统</title>
  <style>
:root{--bg:#060d1a;--cyan:#64d2ff;--green:#30d158;--blue:#007aff;--purple:#bf5af2;--text:#f0f6ff;--text2:#9bb3cd;--text3:#5b7894;--line:rgba(100,180,255,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
canvas#bgCanvas{position:fixed;inset:0;z-index:0}
.content{position:relative;z-index:1;text-align:center;padding:40px 20px;max-width:800px}
.logo{font-size:64px;margin-bottom:16px;filter:drop-shadow(0 0 30px rgba(100,210,255,0.3))}
h1{font-size:42px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--green),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-1px}
.subtitle{font-size:16px;color:var(--text2);margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(48,209,88,0.12);color:var(--green);border:1px solid rgba(48,209,88,0.25);margin-bottom:36px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 4px var(--green)}50%{opacity:0.5;box-shadow:0 0 12px var(--green)}}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:32px;text-align:left}
.mod{background:rgba(10,22,45,0.8);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:all .3s;text-decoration:none;color:var(--text);backdrop-filter:blur(12px)}
.mod:hover{border-color:rgba(100,180,255,0.3);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.mod .m-icon{font-size:24px;margin-bottom:6px}
.mod .m-name{font-size:14px;font-weight:700}
.mod .m-desc{font-size:11px;color:var(--text3);margin-top:2px}
.enter-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 36px;border-radius:14px;background:linear-gradient(135deg,var(--blue),#5e5ce6);color:#fff;font-size:16px;font-weight:700;text-decoration:none;transition:all .3s;box-shadow:0 6px 24px rgba(0,122,255,0.35);letter-spacing:.5px}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(0,122,255,0.5)}
.footer{color:var(--text3);font-size:11px;margin-top:32px}
  </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="content">
  <div class="logo">🔱</div>
  <h1>PoseidonX</h1>
  <div class="subtitle">深海远洋双体船舶智能综合信息系统</div>
  <div class="badge"><span class="dot"></span> AI Native CPS · 53 Channels · 7 Agents</div>
  <div class="modules">
    <a href="/captain-cockpit-new.html" class="mod"><div class="m-icon">⚓</div><div class="m-name">船长中控台</div><div class="m-desc">智能驾驶舱总览</div></a>
    <a href="/navigation-v3.html" class="mod"><div class="m-icon">🧭</div><div class="m-name">智能导航</div><div class="m-desc">ECDIS 海图与航路</div></a>
    <a href="/dp-control.html" class="mod"><div class="m-icon">📍</div><div class="m-name">动力定位</div><div class="m-desc">DP 位置保持系统</div></a>
    <a href="/thruster-control.html" class="mod"><div class="m-icon">⚙️</div><div class="m-name">推进控制</div><div class="m-desc">K-Thrust RCS 推进</div></a>
    <a href="/safety-emergency.html" class="mod"><div class="m-icon">🔥</div><div class="m-name">安全应急</div><div class="m-desc">消防 · ESD · 救生</div></a>
    <a href="/system-evolution.html" class="mod"><div class="m-icon">⚡</div><div class="m-name">系统演进</div><div class="m-desc">AI 自我演进引擎</div></a>
    <a href="/energy-compliance.html" class="mod"><div class="m-icon">🌿</div><div class="m-name">能效合规</div><div class="m-desc">CII/EEXI 碳排放</div></a>
    <a href="/hmi-console.html" class="mod"><div class="m-icon">💬</div><div class="m-name">AI 控制台</div><div class="m-desc">智能对话交互</div></a>
  </div>
  <a href="/captain-cockpit-new.html" class="enter-btn">🚀 进入系统</a>
  <div class="footer">PoseidonX v2.0 © 2026 — AI Native Maritime CPS · IMO MASS Compliant</div>
</div>
<script>
(function(){
  const c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  function resize(){c.width=window.innerWidth*dpr;c.height=window.innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  resize();window.addEventListener('resize',resize);
  const particles=[];
  for(let i=0;i<60;i++)particles.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+1,a:Math.random()*.3+.1});
  function draw(){
    const w=window.innerWidth,h=window.innerHeight;
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(100,210,255,'+p.a+')';ctx.fill();
    });
    // Connection lines
    for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<150){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle='rgba(100,180,255,'+(0.06*(1-d/150))+')';ctx.lineWidth=1;ctx.stroke();}
    }}
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
