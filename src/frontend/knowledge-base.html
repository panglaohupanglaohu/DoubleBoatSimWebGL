<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>知识库 — PoseidonX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;700&family=Noto+Serif:wght@200;300;400;600;900&family=Noto+Serif+SC:wght@200;300;400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap">
<style>
:root{
  --shironeri:oklch(0.96 0.003 110);--ishi:oklch(0.91 0.004 110);--kabe:oklch(0.85 0.005 110);
  --hai:oklch(0.78 0.005 110);--nezumi:oklch(0.68 0.006 110);
  --sumi:oklch(0.18 0.008 110);--sumi-2:oklch(0.38 0.006 110);--sumi-3:oklch(0.55 0.005 110);
  --koke:oklch(0.52 0.04 160);--shu:oklch(0.48 0.07 22);--kitsune:oklch(0.56 0.05 70);
  --rubber:oklch(0.72 0.006 110);--rubber-hover:oklch(0.68 0.007 110);
  --groove:oklch(0.82 0.004 110);--ridge:oklch(1.00 0 0 / 0.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:var(--shironeri);color:var(--sumi);min-height:100vh;padding:48px 24px 24px 80px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(oklch(0 0 0/.012) 1px,transparent 1px),radial-gradient(oklch(0 0 0/.008) 1px,transparent 1px);
  background-size:5px 5px,7px 7px;background-position:0 0,3px 3px}
.kb-layout{max-width:1240px;margin:0 auto;position:relative;z-index:1}
.kb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:14px}
.kb-header h2{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.kb-header h2 .sigil{font-size:20px;font-weight:900;color:var(--shironeri);background:var(--sumi);padding:2px 8px;line-height:1.2}
.kb-stats{display:flex;gap:12px}
.kb-stat{background:var(--ishi);border:1px solid var(--groove);padding:10px 18px;text-align:center;min-width:80px}
.kb-stat .num{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--sumi)}
.kb-stat .lbl{font-size:9px;color:var(--sumi-3);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;font-family:'JetBrains Mono',monospace}
.search-row{display:flex;gap:8px;margin-bottom:16px}
.search-row input{flex:1;background:var(--ishi);border:1px solid var(--groove);padding:12px 18px;color:var(--sumi);font-size:14px;outline:none;font-family:'Noto Sans SC',sans-serif;transition:border-color .2s}
.search-row input:focus{border-color:var(--nezumi)}
.search-row .rubber-btn{display:inline-flex;align-items:center;padding:0 24px;border:none;background:var(--rubber);color:var(--sumi);font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans SC',sans-serif;
  box-shadow:0 2px 3px oklch(0 0 0/.12),0 1px 1px oklch(0 0 0/.08),inset 0 1px 0 var(--ridge),inset 0 -1px 2px oklch(0 0 0/.06);transition:all .08s}
.search-row .rubber-btn:hover{background:var(--rubber-hover)}
.search-row .rubber-btn:active{box-shadow:inset 0 2px 3px oklch(0 0 0/.12),inset 0 1px 1px oklch(0 0 0/.08)}
.search-row .rubber-btn.add{background:var(--koke);color:var(--shironeri)}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:6px 14px;border:1px solid var(--groove);background:transparent;color:var(--sumi-3);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Noto Sans SC',sans-serif}
.filter-chip:hover,.filter-chip.active{background:oklch(0.52 0.04 160/.08);color:var(--koke);border-color:oklch(0.52 0.04 160/.2)}
.results-info{font-size:12px;color:var(--sumi-3);margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.doc-list{display:flex;flex-direction:column;gap:10px}
.doc-card{background:var(--ishi);border:1px solid var(--groove);padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.doc-card:hover{border-color:var(--hai);transform:translateY(-1px)}
.doc-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%}
.doc-card.cat-regulation::before{background:var(--kitsune)}
.doc-card.cat-procedure::before{background:var(--koke)}
.doc-card.cat-technical::before{background:var(--sumi-2)}
.doc-card.cat-training::before{background:var(--nezumi)}
.doc-card.cat-checklist::before{background:var(--shu)}
.doc-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.doc-title .seal{font-size:10px;font-weight:900;color:var(--shironeri);background:var(--sumi);padding:1px 4px;line-height:1.3}
.doc-meta{font-size:10px;color:var(--sumi-3);display:flex;gap:14px;margin-bottom:8px;font-family:'JetBrains Mono',monospace}
.doc-preview{font-size:13px;color:var(--sumi-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-tags{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.tag{background:var(--kabe);border:1px solid var(--groove);padding:2px 10px;font-size:10px;color:var(--sumi-2);font-weight:600;font-family:'JetBrains Mono',monospace}
.score-badge{background:oklch(0.48 0.07 22/.08);border:1px solid oklch(0.48 0.07 22/.15);padding:2px 10px;font-size:10px;color:var(--shu);font-weight:600;font-family:'JetBrains Mono',monospace}
.doc-detail{display:none;position:fixed;inset:0;z-index:900;background:oklch(0 0 0/.3);justify-content:center;align-items:center}
.doc-detail.open{display:flex}
.detail-inner{background:var(--shironeri);border:1px solid var(--groove);width:750px;max-width:94vw;max-height:85vh;overflow-y:auto;padding:32px}
.detail-inner h3{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:600;margin-bottom:8px}
.detail-inner .doc-meta{margin-bottom:14px}
.detail-inner pre{background:var(--ishi);border:1px solid var(--groove);padding:16px;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;font-family:'JetBrains Mono',monospace;color:var(--sumi-2)}
.detail-actions{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--groove)}
.btn{padding:8px 18px;border:1px solid var(--groove);background:transparent;color:var(--sumi-2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Noto Sans SC',sans-serif}
.btn:hover{background:var(--kabe)}
.btn-primary{background:var(--sumi);color:var(--shironeri);border:none}
.btn-danger{background:oklch(0.48 0.07 22/.08);color:var(--shu);border-color:oklch(0.48 0.07 22/.2)}
.add-overlay{display:none;position:fixed;inset:0;z-index:900;background:oklch(0 0 0/.3);justify-content:center;align-items:center}
.add-overlay.open{display:flex}
.add-form{background:var(--shironeri);border:1px solid var(--groove);width:600px;max-width:94vw;max-height:85vh;overflow-y:auto;padding:32px}
.add-form h3{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:600;margin-bottom:16px}
.add-form label{font-size:11px;color:var(--sumi-3);display:block;margin-bottom:4px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;font-family:'JetBrains Mono',monospace}
.add-form input,.add-form textarea,.add-form select{width:100%;background:var(--ishi);border:1px solid var(--groove);padding:10px 14px;color:var(--sumi);font-size:13px;outline:none;font-family:'Noto Sans SC',sans-serif;transition:border-color .2s}
.add-form input:focus,.add-form textarea:focus{border-color:var(--nezumi)}
.add-form textarea{min-height:180px;resize:vertical;font-family:'JetBrains Mono',monospace}
.add-form select{cursor:pointer}
.add-form .form-actions{display:flex;gap:8px;margin-top:18px}
.empty-state{text-align:center;padding:60px 20px;color:var(--sumi-3)}
.empty-state .big{font-family:'Noto Serif SC',serif;font-size:48px;margin-bottom:14px;opacity:.6}
.empty-state p{font-size:14px;margin-bottom:16px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--hai)}
</style>
<link rel="stylesheet" href="/css/openbridge-theme.css">
<link rel="stylesheet" href="/css/ws-theme-bridge.css">
</head>
<body>
<div class="kb-layout">
  <div class="kb-header">
    <h2><span class="sigil">库</span> 知识库</h2>
    <div class="kb-stats">
      <div class="kb-stat"><div class="num" id="stat-docs">0</div><div class="lbl">文档</div></div>
      <div class="kb-stat"><div class="num" id="stat-chunks">0</div><div class="lbl">向量</div></div>
      <div class="kb-stat"><div class="num" id="stat-domains">0</div><div class="lbl">領域</div></div>
    </div>
  </div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="语义搜索 — 输入问題或关键詞…" autocomplete="off">
    <button class="rubber-btn" id="searchBtn">搜索</button>
    <button class="rubber-btn add" id="addBtn">＋ 添加</button>
  </div>
  <div class="filters" id="filterBar">
    <span class="filter-chip active" data-cat="">全部</span>
    <span class="filter-chip" data-cat="regulation">规 法规</span>
    <span class="filter-chip" data-cat="procedure">程 程序</span>
    <span class="filter-chip" data-cat="technical">技 技术</span>
    <span class="filter-chip" data-cat="training">训 培训</span>
    <span class="filter-chip" data-cat="checklist">査 清單</span>
  </div>
  <div class="results-info" id="resultsInfo"></div>
  <div class="doc-list" id="docList"></div>
</div>
<div class="doc-detail" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-inner" id="detailContent"></div>
</div>
<div class="add-overlay" id="addOverlay" onclick="if(event.target===this)closeAdd()">
  <div class="add-form">
    <h3>添加知识文档</h3>
    <label>标題</label><input type="text" id="addTitle" placeholder="文档标題">
    <label>类別</label><select id="addCat"><option value="regulation">法规</option><option value="procedure">程序</option><option value="technical">技术</option><option value="training">培训</option><option value="checklist">清單</option></select>
    <label>标籤 (逗号分隔)</label><input type="text" id="addTags" placeholder="SOLAS, IMO, 导航">
    <label>內容</label><textarea id="addContent" placeholder="文档內容…"></textarea>
    <div class="form-actions"><button class="btn" onclick="closeAdd()">取消</button><button class="btn btn-primary" onclick="submitDoc()">提交</button></div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let _docs=[],_filter='',_searchQuery='';
const CAT_SEALS={regulation:'规',procedure:'程',technical:'技',training:'训',checklist:'査'};

function renderDocs(){
  let docs=_docs;
  if(_filter)docs=docs.filter(d=>(d.category||'').toLowerCase()===_filter);
  $('resultsInfo').textContent=_searchQuery?docs.length+' 條搜索结果 —「'+_searchQuery+'」':docs.length+' 篇文档';
  if(!docs.length){$('docList').innerHTML='<div class="empty-state"><div class="big">库</div><p>'+(_searchQuery?'未找到匹配文档':'知识库为空 — 点擊添加按鈕导入文档')+'</p></div>';return;}
  $('docList').innerHTML=docs.map(d=>{
    const cat=(d.category||'technical').toLowerCase();
    const seal=CAT_SEALS[cat]||'文';
    const tags=(d.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
    const score=d.score?'<span class="score-badge">相关度 '+Math.round(d.score*100)+'%</span>':'';
    return '<div class="doc-card cat-'+cat+'" onclick="showDetail(\''+esc(d.id)+'\')"><div class="doc-title"><span class="seal">'+seal+'</span> '+esc(d.title)+' '+score+'</div><div class="doc-meta"><span>'+esc(d.category||'技术')+'</span><span>'+esc(d.source||'PoseidonX')+'</span><span>'+esc(d.updated_at||d.created_at||'')+'</span><span>'+((d.content||'').length)+' 字符</span></div><div class="doc-preview">'+esc((d.content||'').substring(0,200))+'</div><div class="doc-tags">'+tags+'</div></div>';
  }).join('');
}

function updateStats(){
  $('stat-docs').textContent=_docs.length;
  $('stat-chunks').textContent=_docs.reduce((s,d)=>s+((d.content||'').length>500?Math.ceil((d.content||'').length/500):1),0);
  const domains=new Set(_docs.map(d=>d.category||'unknown'));
  $('stat-domains').textContent=domains.size;
}

async function loadDocs(){
  try{const r=await fetch('/api/v1/knowledge/documents');const d=await r.json();_docs=d.documents||d||[];}catch(e){_docs=getSampleDocs()}
  updateStats();renderDocs();
}

function getSampleDocs(){
  return [
    {id:'kb-001',title:'SOLAS Chapter III — Life-Saving Appliances',category:'regulation',tags:['SOLAS','LSA','IMO'],source:'IMO',content:'SOLAS Chapter III规定了船舶救生设备的要求。包括救生艇、救生筏、救生衣、浸水服等设备的数量、布置和维护标准。所有客船和500总噸以上的貨船必須配备符合LSA规則的救生设备。\n\n关键要求：\n- 救生艇容量：全船人员100%\n- 棄船集合时間：≤10分鐘\n- 救生艇下水时間：≤30分鐘\n- EPIRB 自动释放：水深1-4米',updated_at:'2026-03-15'},
    {id:'kb-002',title:'COLREGs 国际海上避碰规則精要',category:'regulation',tags:['COLREGs','避碰','Rule 13-17'],source:'IMO',content:'COLREGs (1972) 是国际海上避碰的基本法规。\n\nRule 13: 追越 — 从另一船正橫後大于 22.5° 追上为追越船\nRule 14: 对遇 — 兩船互見对遇，各向右转向\nRule 15: 交叉 — 見他船在右舷的应讓路\nRule 16: 讓路船行动 — 儘早、大幅度行动\nRule 17: 直行船行动 — 保持航向航速，必要时採取行动',updated_at:'2026-03-20'},
    {id:'kb-003',title:'穿浪雙体船 (WPC) 结构设计指南',category:'technical',tags:['WPC','DNV GL','结构'],source:'DNV GL',content:'穿浪雙体船设计需特別关注：\n1. 砰擊载荷 (Slamming) — 濕甲板底部压力可达 200kPa\n2. 鞭擊响应 (Whipping) — 縱向彎矩放大係数 1.3-1.6\n3. 连接橋结构 — 扭转和剪切载荷\n4. 疲勞評估 — 应力集中係数 SCF > 2.0 区域',updated_at:'2026-03-18'},
    {id:'kb-004',title:'IAMSAR 搜救手冊 Vol III — 搜索模式',category:'procedure',tags:['IAMSAR','SAR','MOB'],source:'IMO/ICAO',content:'IAMSAR Vol III 主要搜索模式：\n\n1. Expanding Square Search (擴展方形搜索)\n2. Sector Search (扇形搜索)\n3. Parallel Track Search (平行航跡搜索)',updated_at:'2026-04-01'},
    {id:'kb-005',title:'MLC 2006 船员休息时間规定',category:'regulation',tags:['MLC','STCW','休息时間'],source:'ILO',content:'海事勞工公約 (MLC 2006) 船员休息时間要求：\n最低休息时間标准：24小时內至少 10 小时，7天內至少 77 小时。',updated_at:'2026-02-28'},
    {id:'kb-006',title:'棄船演習操作清單',category:'checklist',tags:['应急','演習','SOLAS'],source:'PoseidonX',content:'棄船演習检查项目：\n□ 发出棄船警报（7短1长）\n□ 确认应急照明系统\n□ 集合站人员点名\n□ 分配救生衣並检查穿著',updated_at:'2026-04-05'},
    {id:'kb-007',title:'气象航线优化 — ISO 19030',category:'technical',tags:['航线优化','气象','能效'],source:'ISO',content:'ISO 19030 船舶能效評估框架：航线优化目标包括燃油消耗最小化、到达时間約束、安全裕度保持。',updated_at:'2026-03-25'},
    {id:'kb-008',title:'网絡安全应急响应程序',category:'procedure',tags:['网絡安全','IMO','应急'],source:'BIMCO',content:'IMO MSC-FAL.1/Circ.3 网絡安全应急响应：检测、隔离、恢復、报告四階段流程。',updated_at:'2026-04-08'}
  ];
}

async function searchDocs(){
  const q=$('searchInput').value.trim();_searchQuery=q;
  if(!q){await loadDocs();return;}
  try{const r=await fetch('/api/v1/knowledge/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,top_k:20})});const d=await r.json();_docs=(d.results||d.documents||[]);}catch(e){
    const allDocs=getSampleDocs();const ql=q.toLowerCase();
    _docs=allDocs.filter(d=>(d.title+''+d.content+''+(d.tags||[]).join('')).toLowerCase().includes(ql));
    _docs.forEach(d=>d.score=0.7+Math.random()*0.3);
  }
  updateStats();renderDocs();
}

function showDetail(id){
  const doc=_docs.find(d=>d.id===id);if(!doc)return;
  $('detailContent').innerHTML='<h3>'+esc(doc.title)+'</h3><div class="doc-meta"><span>'+esc(doc.category||'')+'</span><span>'+esc(doc.source||'')+'</span><span>'+esc(doc.updated_at||'')+'</span></div><div class="doc-tags">'+(doc.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><pre>'+esc(doc.content||'')+'</pre><div class="detail-actions"><button class="btn" onclick="closeDetail()">关闭</button><button class="btn btn-primary" onclick="copyContent(\''+esc(doc.id)+'\')">复製內容</button><button class="btn btn-danger" onclick="deleteDoc(\''+esc(doc.id)+'\')">刪除</button></div>';
  $('detailOverlay').classList.add('open');
}
function closeDetail(){$('detailOverlay').classList.remove('open')}
function closeAdd(){$('addOverlay').classList.remove('open')}
function copyContent(id){const doc=_docs.find(d=>d.id===id);if(!doc)return;navigator.clipboard.writeText(doc.content||'').catch(()=>{});}
async function deleteDoc(id){try{await fetch('/api/v1/knowledge/documents/'+encodeURIComponent(id),{method:'DELETE'})}catch(e){}_docs=_docs.filter(d=>d.id!==id);closeDetail();updateStats();renderDocs();}
async function submitDoc(){
  const title=$('addTitle').value.trim();const content=$('addContent').value.trim();
  if(!title||!content)return;
  const doc={title,category:$('addCat').value,tags:$('addTags').value.split(',').map(t=>t.trim()).filter(Boolean),content};
  try{await fetch('/api/v1/knowledge/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(doc)})}catch(e){}
  doc.id='kb-'+Date.now();doc.updated_at=new Date().toISOString().split('T')[0];
  _docs.unshift(doc);closeAdd();updateStats();renderDocs();
  $('addTitle').value='';$('addContent').value='';$('addTags').value='';
}
$('searchBtn').addEventListener('click',searchDocs);
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchDocs()});
$('addBtn').addEventListener('click',()=>$('addOverlay').classList.add('open'));
$('filterBar').addEventListener('click',e=>{
  const chip=e.target.closest('.filter-chip');if(!chip)return;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');_filter=chip.dataset.cat||'';renderDocs();
});
loadDocs();
</script>
<script src="/js/i18n.js"></script>
<script src="/js/nav-sidebar.js" data-active="kb"></script>
</body>
</html>
